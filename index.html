<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Protocolo 12 Semanas — Sprint Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2321">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino Tracker">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#EEF0EA;
    --paper-raised:#FFFFFF;
    --ink:#1C2321;
    --ink-muted:#5C665E;
    --ink-faint:#8B948C;
    --line:#D7DACF;
    --orange:#E8590C;
    --orange-soft:#FBE4D4;
    --green:#2E7D52;
    --green-soft:#DCEEE2;
    --blue:#3E5C78;
    --blue-soft:#DCE4EC;
    --red:#B4483A;
    --radius:3px;
  }
  [data-theme="dark"]{
    --paper:#15181A;
    --paper-raised:#1E2225;
    --ink:#EDEFEA;
    --ink-muted:#A6AFA8;
    --ink-faint:#6E766F;
    --line:#33383A;
    --orange:#FF7A38;
    --orange-soft:#3A2A1E;
    --green:#57C98A;
    --green-soft:#1C3327;
    --blue:#7FA0C0;
    --blue-soft:#20303F;
    --red:#E07364;
  }
  body{transition:background-color .2s, color .2s;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px;}
  h1,h2,h3,h4{font-family:'Oswald',system-ui,sans-serif;font-weight:600;margin:0;letter-spacing:0.2px;}
  .num{font-variant-numeric:tabular-nums;}

  .hero{margin-bottom:22px;}
  .hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .hero-week{font-size:56px;line-height:1;color:var(--ink);}
  .hero-week span{color:var(--ink-faint);font-size:28px;}
  .hero-meso{font-family:'Inter';font-size:14px;color:var(--ink-muted);margin-top:4px;}
  .phase-pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600;margin-left:8px;vertical-align:middle;}
  .phase-adaptacao{background:var(--blue-soft);color:var(--blue);}
  .phase-volume{background:var(--orange-soft);color:var(--orange);}
  .phase-forca{background:#EFE0EE;color:#7A3E78;}
  .phase-deload{background:var(--green-soft);color:var(--green);}

  .week-nav{display:flex;gap:8px;align-items:center;}
  .week-nav button{border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);width:44px;height:44px;border-radius:var(--radius);cursor:pointer;font-size:18px;}
  .week-nav button:hover{border-color:var(--ink-faint);}

  .track{display:flex;gap:3px;margin-top:14px;}
  .track a{flex:1;height:22px;border-radius:2px;cursor:pointer;position:relative;background:var(--line);text-decoration:none;}
  .track a.build{background:#BFE0CC;}
  .track a.deload{background:#CBD8E2;}
  .track a.current{outline:2px solid var(--ink);outline-offset:1px;}
  .track-label{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-top:4px;}

  .tabs{display:flex;gap:2px;margin:24px 0 16px;border-bottom:1px solid var(--line);}
  .tab{padding:9px 4px;margin-right:20px;font-family:'Oswald';font-size:14px;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
  .tab.active{color:var(--ink);border-bottom-color:var(--orange);}

  .day-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px;}
  .day-chip{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:8px 4px;text-align:center;cursor:pointer;}
  .day-chip.active{border-color:var(--ink);}
  .day-chip .dlabel{font-size:12px;font-weight:600;}
  .day-chip .dfocus{font-size:10px;color:var(--ink-faint);margin-top:2px;height:24px;overflow:hidden;line-height:1.2;}

  .panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .panel-head h2{font-size:20px;}

  .edit-toggle-btn{font-size:12px;font-weight:600;padding:6px 10px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink-muted);cursor:pointer;}
  .edit-toggle-btn.on{background:var(--orange-soft);color:var(--orange);border-color:var(--orange);}

  .block-label{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-faint);margin:16px 0 6px;}

  .ex-card{border-top:1px solid var(--line);padding:10px 0;}
  .ex-card:first-of-type{border-top:none;}
  .ex-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;}
  .ex-card-head .ex-name{font-size:13.5px;font-weight:500;flex:1;}
  .ex-name .main-flag{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-muted);margin-right:6px;vertical-align:middle;}
  .ex-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .ex-target-inline{font-size:11px;color:var(--ink-muted);}
  .ex-summary-chip{font-size:11px;color:var(--green);font-weight:600;min-height:14px;}
  .chevron{color:var(--ink-faint);font-size:14px;padding:10px 6px;}
  .ex-card-body{margin-top:10px;}
  .ex-note-line{font-size:11px;color:var(--ink-faint);margin-bottom:10px;}

  .set-row{padding:8px 0;border-top:1px solid var(--line);}
  .set-row:first-of-type{border-top:none;}
  .set-row-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .set-num{font-size:11px;color:var(--ink-faint);flex-shrink:0;}
  .set-type-toggle{font-size:10px;font-weight:600;padding:9px 8px;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:var(--paper);color:var(--ink-muted);flex-shrink:0;width:58px;min-height:36px;}
  .set-type-toggle.aquecimento{background:var(--blue-soft);color:var(--blue);border-color:var(--blue);}
  .set-type-toggle.trabalho{background:var(--orange-soft);color:var(--orange);border-color:var(--orange);}
  .set-row-bottom{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .stepper{display:flex;align-items:center;gap:0;flex:1;min-width:110px;}
  .stepper button{width:34px;height:36px;flex-shrink:0;border:1px solid var(--line);background:var(--paper);color:var(--ink-muted);font-size:16px;cursor:pointer;}
  .stepper button:first-child{border-radius:4px 0 0 4px;}
  .stepper button:last-child{border-radius:0 4px 4px 0;}
  .stepper input{flex:1;min-width:0;height:36px;padding:0 2px;border:1px solid var(--line);border-left:none;border-right:none;font-size:13px;text-align:center;background:var(--paper);color:var(--ink);font-family:'Inter';}
  .set-row input.plain{flex:1;min-width:60px;height:36px;padding:0 6px;border:1px solid var(--line);border-radius:4px;font-size:13px;text-align:center;background:var(--paper);color:var(--ink);font-family:'Inter';}
  .set-row input.rpe-input{max-width:56px;flex:0 0 56px;}
  .set-rm-btn{background:none;border:1px solid var(--line);color:var(--red);border-radius:2px;width:40px;height:40px;cursor:pointer;font-size:16px;flex-shrink:0;margin-left:auto;}
  .add-set-btn{margin-top:8px;margin-right:6px;font-size:12px;font-weight:600;padding:8px 12px;border-radius:14px;border:1px dashed var(--ink-faint);background:none;color:var(--ink-muted);cursor:pointer;}
  .obs-input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:2px;font-size:12px;margin-top:10px;background:var(--paper);color:var(--ink);font-family:'Inter';}
  .e1rm-note{font-size:11px;color:var(--ink);margin-top:8px;font-weight:700;}
  .delta-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;margin-top:2px;}
  .delta-badge.up{background:var(--green-soft);color:var(--green);}
  .delta-badge.down{background:#F8DCD6;color:var(--red);}
  .delta-badge.neutral{background:var(--line);color:var(--ink-muted);}

  .ex-edit-row{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line);}
  .ex-edit-row:first-of-type{border-top:none;}
  .ex-edit-row input.ex-edit-name{flex:2;min-width:0;padding:6px;border:1px solid var(--line);border-radius:2px;font-size:12.5px;font-family:'Inter';}
  .ex-edit-row input.small{flex:1;min-width:0;padding:6px;border:1px solid var(--line);border-radius:2px;font-size:12.5px;text-align:center;font-family:'Inter';}
  .rm-btn{background:none;border:1px solid var(--line);color:var(--red);border-radius:2px;width:40px;height:40px;cursor:pointer;font-size:17px;flex-shrink:0;}
  .add-ex-form{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
  .add-ex-form input{padding:7px;border:1px solid var(--line);border-radius:2px;font-size:12.5px;font-family:'Inter';}
  .add-ex-form input#new-ex-name{flex:2;min-width:120px;}
  .add-ex-btn{background:var(--ink);color:var(--paper-raised);border:none;border-radius:14px;padding:0 14px;font-size:12px;cursor:pointer;font-weight:600;}
  .restore-btn{font-size:11px;color:var(--ink-faint);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;margin-top:12px;display:block;}
  .scope-select-wrap{margin-bottom:14px;}
  .scope-select-wrap label{font-size:11px;color:var(--ink-faint);display:block;margin-bottom:4px;}
  .scope-select-wrap select{padding:7px;border:1px solid var(--line);border-radius:2px;font-size:12.5px;font-family:'Inter';background:var(--paper-raised);color:var(--ink);width:100%;max-width:280px;}

  .vol-dropdown{margin-bottom:16px;border:1px solid var(--line);border-radius:var(--radius);padding:0 12px;}
  .vol-dropdown summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-muted);padding:10px 0;list-style:none;}
  .vol-dropdown summary::-webkit-details-marker{display:none;}
  .vol-dropdown summary::after{content:'▾';float:right;color:var(--ink-faint);}
  .vol-dropdown[open] summary::after{content:'▴';}
  .vol-list{font-size:12px;padding-bottom:10px;}
  .vol-list-row{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line);color:var(--ink-muted);}
  .vol-list-row:first-child{border-top:none;}
  .vol-total{font-weight:600;margin-top:4px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--ink);}

  .totals-card{background:var(--blue-soft);border-radius:var(--radius);padding:14px;margin-top:16px;}
  .totals-card h4{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--blue);margin-bottom:10px;}
  .totals-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;}
  .totals-grid .tval{font-family:'Oswald';font-size:22px;color:var(--ink);}
  .totals-grid .tlabel{font-size:10px;color:var(--ink-muted);}
  .totals-split{font-size:11px;color:var(--ink-muted);margin-top:10px;text-align:center;}

  .cardio-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:8px;}
  .cardio-card .ctitle{font-weight:600;font-size:13.5px;margin-bottom:4px;}
  .cardio-card .ctarget{font-size:12px;color:var(--ink-muted);margin-bottom:8px;}
  .cardio-inputs{display:flex;gap:8px;flex-wrap:wrap;}
  .cardio-inputs label{font-size:11px;color:var(--ink-faint);display:block;margin-bottom:3px;}
  .cardio-inputs input{padding:6px 8px;border:1px solid var(--line);border-radius:2px;font-size:13px;width:100px;background:var(--paper-raised);font-family:'Inter';}

  .retro{margin-top:16px;}
  .retro textarea{width:100%;min-height:64px;padding:10px;border:1px solid var(--line);border-radius:var(--radius);font-family:'Inter';font-size:13px;resize:vertical;background:var(--paper);color:var(--ink);}
  .retro-label{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-faint);margin-bottom:6px;}

  .save-tick{font-size:11px;color:var(--green);opacity:0;transition:opacity .3s;position:fixed;bottom:16px;right:16px;background:var(--paper-raised);border:1px solid var(--green);padding:5px 10px;border-radius:12px;}
  .save-tick.show{opacity:1;}
  .save-tick.error{color:var(--red);border-color:var(--red);font-weight:600;cursor:pointer;}
  .storage-warning{background:#F8DCD6;color:var(--red);border:1px solid var(--red);border-radius:var(--radius);padding:10px 14px;font-size:12.5px;margin-bottom:16px;font-weight:600;}

  .chart-block{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .chart-block h3{font-size:15px;margin-bottom:2px;}
  .chart-sub{font-size:12px;color:var(--ink-faint);margin-bottom:10px;}
  svg.chart{width:100%;height:150px;overflow:visible;}
  .chart-empty{font-size:12px;color:var(--ink-faint);padding:20px 0;text-align:center;}

  .ring-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
  .ring-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center;}
  .ring-card .rnum{font-family:'Oswald';font-size:26px;}
  .ring-card .rlabel{font-size:11px;color:var(--ink-faint);margin-top:2px;}

  .export-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .export-btn{font-family:'Inter';font-size:12px;font-weight:600;padding:7px 12px;border-radius:14px;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink-muted);cursor:pointer;}
  .export-btn:hover{border-color:var(--ink-faint);color:var(--ink);}

  table.overview{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.overview th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-faint);padding:6px 6px;border-bottom:1px solid var(--line);}
  table.overview td{padding:7px 6px;border-bottom:1px solid var(--line);}
  table.overview tr.current td{background:var(--orange-soft);}

  @media (max-width:520px){
    .hero-week{font-size:44px;}
    .day-chip .dfull{display:none;}
    .day-chip .dshort{display:block;}
    .totals-grid{gap:6px;}
    .totals-grid .tval{font-size:19px;}
    .program-switcher{max-width:55vw;}
    .rest-timer-widget, .undo-toast{left:10px;right:10px;bottom:10px;padding:10px 12px;}
  }
  @media (min-width:521px){
    .day-chip .dshort{display:none;}
  }

  /* ---- Theme toggle & program switcher ---- */
  .icon-btn{border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);width:40px;height:40px;border-radius:var(--radius);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{border-color:var(--ink-faint);}
  .top-controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}
  .program-switcher{font-size:12.5px;color:var(--ink-muted);background:none;border:none;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:2px;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;}
  .track-toggle-row{display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-top:14px;}
  .track-toggle-row .compact-label{font-size:13px;color:var(--ink-muted);}
  .track-toggle-row .toggle-chevron{font-size:11px;color:var(--ink-faint);}
  .program-panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .program-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);gap:8px;}
  .program-row:first-of-type{border-top:none;}
  .program-row.active{font-weight:600;}
  .program-row button{font-size:11px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink-muted);cursor:pointer;}
  .program-new-form{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);flex-wrap:wrap;}
  .program-new-form input{flex:1;min-width:140px;padding:8px;border:1px solid var(--line);border-radius:2px;font-size:13px;font-family:'Inter';}
  .program-new-form input[type="date"]{flex:0 0 150px;}

  /* ---- Rest timer widget ---- */
  .rest-timer-widget{position:fixed;left:16px;right:16px;bottom:16px;max-width:728px;margin:0 auto;background:var(--ink);color:var(--paper-raised);border-radius:var(--radius);padding:12px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,0.25);}
  .rest-timer-widget.show{display:flex;}
  .rest-timer-widget .rt-time{font-family:'Oswald';font-size:26px;}
  .rest-timer-widget .rt-label{font-size:11px;opacity:0.7;}
  .rest-timer-widget button{background:none;border:1px solid rgba(255,255,255,0.4);color:var(--paper-raised);border-radius:14px;padding:8px 14px;font-size:12px;cursor:pointer;font-weight:600;}
  .rest-btn-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .rest-btn-row button{font-size:11px;font-weight:600;padding:8px 10px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink-muted);cursor:pointer;}

  /* ---- Undo toast ---- */
  .undo-toast{position:fixed;left:16px;right:16px;bottom:16px;max-width:728px;margin:0 auto;background:var(--ink);color:var(--paper-raised);border-radius:var(--radius);padding:12px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,0.25);}
  .undo-toast.show{display:flex;}
  .undo-toast span{font-size:13px;}
  .undo-toast button{background:none;border:1px solid rgba(255,255,255,0.4);color:var(--paper-raised);border-radius:14px;padding:7px 14px;font-size:12px;cursor:pointer;font-weight:600;}

  /* ---- PR badge ---- */
  .pr-badge{display:inline-block;font-size:10px;font-weight:700;color:#8A5A00;background:#FFE29B;border-radius:8px;padding:2px 6px;margin-left:6px;}

  /* ---- Day reminder banner ---- */
  .day-reminder{background:var(--orange-soft);border:1px solid var(--orange);color:var(--orange);border-radius:var(--radius);padding:12px 14px;font-size:13px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .day-reminder button{font-size:12px;font-weight:600;padding:7px 12px;border-radius:14px;border:1px solid var(--orange);background:var(--paper-raised);color:var(--orange);cursor:pointer;flex-shrink:0;}
  .day-reminder .dismiss{background:none;border:none;color:var(--orange);font-size:16px;padding:4px 8px;cursor:pointer;font-weight:400;}

  .auth-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .auth-tabs button{flex:1;padding:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink-muted);border-radius:14px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .auth-tabs button.on{background:var(--ink);color:var(--paper-raised);border-color:var(--ink);}
  .auth-input{width:100%;padding:10px;border:1px solid var(--line);border-radius:2px;font-family:'Inter';font-size:14px;margin-bottom:8px;background:var(--paper);color:var(--ink);}
  .link-btn{background:none;border:none;color:var(--ink-muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:6px 0;}
  .day-notes{margin-top:16px;}
  .day-notes textarea{width:100%;min-height:84px;padding:10px;border:1px solid var(--line);border-radius:var(--radius);font-family:'Inter';font-size:13px;resize:vertical;background:var(--paper);color:var(--ink);}
  .prev-note-block{font-size:11.5px;color:var(--ink-faint);margin-top:6px;white-space:pre-wrap;}
  .rpe-input.auto{font-style:italic;color:var(--ink-muted);}
  .set-type-toggle.drop{background:#EFE0EE;color:#7A3E78;border-color:#7A3E78;}

function computeWeekTonnage(weekObj){
  if(!weekObj || !weekObj.logs) return null;
  let total = 0, any = false;
  Object.keys(weekObj.logs).forEach(exId=>{
    if(TIME_BASED_IDS.has(exId)) return;
    const log = weekObj.logs[exId];
    if(!log || !Array.isArray(log.sets)) return;
    log.sets.forEach(st=>{
      const x = setStats(st, null);
      if(x.sets){ total += x.vol; any = true; }
    });
  });
  return any ? Math.round(total) : null;

/* ============================= STORAGE (IndexedDB) ============================= */

const DB_NAME = 'treino-tracker-db';
const STORE_NAME = 'kv';
let dbPromise = null;
let memoryFallback = null; // used only if IndexedDB itself is unavailable (e.g. some private-browsing modes)

function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB indisponível')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(STORE_NAME); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return dbPromise;
}
async function idbGetRaw(key){
  if(memoryFallback) return memoryFallback.has(key) ? memoryFallback.get(key) : null;
  try{
    const db = await openDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = ()=>resolve(req.result===undefined ? null : req.result);
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){
    if(!memoryFallback) memoryFallback = new Map();
    return memoryFallback.has(key) ? memoryFallback.get(key) : null;
  }
}
async function idbSetRaw(key, value){
  if(memoryFallback){ memoryFallback.set(key, value); return true; }
  try{
    const db = await openDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(value, key);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){
    if(!memoryFallback) memoryFallback = new Map();
    memoryFallback.set(key, value);
    return true; // succeeded in-memory; caller doesn't need to know it's degraded here
  }
}
async function kvKeys(prefix){
  if(memoryFallback) return Array.from(memoryFallback.keys()).filter(k=>k.startsWith(prefix));
  try{
    const db = await openDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).getAllKeys();
      req.onsuccess = ()=>resolve(req.result.filter(k=>String(k).startsWith(prefix)));
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ return []; }
}

async function cloudSet(key, value){

/* ============================= WEEK DATA LOAD/SAVE ============================= */

function emptyWeekData(){
  return {logs:{}, cardio:{}, retro:'', dayNotes:{}};
}

async function loadWeek(n){
  try{
    const raw = await kvGet(pk('week:'+n));
    weekData = raw ? JSON.parse(raw) : emptyWeekData();
    if(!weekData.logs) weekData.logs = {};
    if(!weekData.cardio) weekData.cardio = {};
    if(!weekData.dayNotes) weekData.dayNotes = {};
    Object.keys(weekData.logs).forEach(id=>{ weekData.logs[id] = migrateLog(weekData.logs[id]); });
  }catch(e){ weekData = emptyWeekData(); }
}

function migrateLog(log){
  if(!log) return {sets:[], obs:''};
  if(Array.isArray(log.sets) && log.sets.length>0) return log;
  const sets = Array.isArray(log.sets) ? log.sets.slice() : [];
  if(log.carga || log.reps){
    sets.push({tipo:'trabalho', carga:log.carga||'', reps:log.reps||'', rpe:log.rpe||''});
  }
  if(log.warmCarga || log.warmReps || log.warmSets){
    const n = parseInt(log.warmSets)||1;
    for(let i=0;i<n;i++){
      sets.push({tipo:'aquecimento', carga:log.warmCarga||'', reps:log.warmReps||'', rpe:''});
    }
  }
  return {sets, obs: log.obs||''};
}

async function loadPrevWeek(n){
  if(n<=1){ prevWeekData = null; return; }
  try{
    const raw = await kvGet(pk('week:'+(n-1)));
    prevWeekData = raw ? JSON.parse(raw) : null;
    if(prevWeekData && prevWeekData.logs){
      Object.keys(prevWeekData.logs).forEach(id=>{ prevWeekData.logs[id] = migrateLog(prevWeekData.logs[id]); });
    }
  }catch(e){ prevWeekData = null; }
}

async function loadTemplates(){
  try{
    const raw = await kvGet(pk('templates'));
    customTemplates = raw ? JSON.parse(raw) : {};
  }catch(e){ customTemplates = {}; }
}
async function saveTemplates(){
  await kvSet(pk('templates'), JSON.stringify(customTemplates));
}

let saveQueue = Promise.resolve();
function queueWeekSave(programId, weekNum, payload){
  saveQueue = saveQueue.then(()=>persistWeek(programId, weekNum, payload));
  return saveQueue;
}
async function persistWeek(programId, weekNum, payload){
  const ok = await kvSet('prog:'+programId+':week:'+weekNum, payload);
  if(weeksCache && weeksCache.program===programId){
    try{ weeksCache.data[weekNum-1] = JSON.parse(payload); }catch(e){}
  }
  flashStatus(!!ok);
}

function scheduleSave(){
  clearTimeout(saveTimer);
  const snapProgram = currentProgram;
  const snapWeek = currentWeek;
  const snapPayload = JSON.stringify(weekData);
  saveTimer = setTimeout(()=>{ queueWeekSave(snapProgram, snapWeek, snapPayload); }, 400);
}
async function saveWeek(){
  clearTimeout(saveTimer);
  const snapProgram = currentProgram;
  const snapWeek = currentWeek;
  const snapPayload = JSON.stringify(weekData);
  await queueWeekSave(snapProgram, snapWeek, snapPayload);
}
function flashSaved(){ flashStatus(true); }
function flashStatus(ok, message){
  const el = document.getElementById('save-tick');
  if(!el) return;
  el.textContent = message || (ok ? 'salvo' : 'erro ao salvar');
  el.classList.toggle('error', !ok);
  el.classList.add('show');
  clearTimeout(window.__st);
  window.__st = setTimeout(()=>el.classList.remove('show'), ok?1200:9000);
}
async function loadMeta(){
  const raw = await kvGet(pk('meta'));
  if(raw){
    try{ const m = JSON.parse(raw); currentWeek = m.currentWeek || 1; }catch(e){}
  }
}
async function saveMeta(){
  await kvSet(pk('meta'), JSON.stringify({currentWeek}));
  const meta = currentProgramMeta();
  if(meta){ meta.lastWeek = currentWeek; await saveProgramsList(); }
}

/* ============================= TEMPLATE HELPERS (scoped by mesociclo) ============================= */

function getDayExercisesForScope(day, scopeKey){
  const dayCustom = customTemplates[day.key] || {};
  const allScope = dayCustom.all || {};
  const mesoScope = (scopeKey!=='all') ? (dayCustom[scopeKey] || {}) : {};
  const removed = new Set([...(allScope.removed||[]), ...(mesoScope.removed||[])]);
  let list = day.strength.filter(ex=>!removed.has(ex.id)).map(ex=>{
    let merged = ex;
    if(allScope.overrides && allScope.overrides[ex.id]) merged = Object.assign({}, merged, allScope.overrides[ex.id]);
    if(mesoScope.overrides && mesoScope.overrides[ex.id]) merged = Object.assign({}, merged, mesoScope.overrides[ex.id]);
    return merged;
  });
  list = list.concat(allScope.added || []);
  if(scopeKey!=='all') list = list.concat(mesoScope.added || []);
  return list;
}

function getDayExercises(day, wk){
  return getDayExercisesForScope(day, wk.mesoKey);
}

function dayCustom(day){ return customTemplates[day.key] || {}; }
function dayFocus(day){ const m = dayCustom(day).dayMeta; return (m && m.focus) ? m.focus : day.focus; }
function isRestDay(day){ const m = dayCustom(day).dayMeta; return !!(m && m.rest); }
function ensureDayMeta(day){
  if(!customTemplates[day.key]) customTemplates[day.key] = {};
  if(!customTemplates[day.key].dayMeta) customTemplates[day.key].dayMeta = {};
  return customTemplates[day.key].dayMeta;
}
function effectiveCardio(day){
  const c = dayCustom(day);
  const cfg = c.cardioConfig;
  const base = day.cardio || null;
  const empty = {adaptacao:'', volume:'', forca:'', deload:''};
  if(cfg){
    if(cfg.enabled===false) return null;
    const type = cfg.type || 'custom';
    return {
      id: cfg.id || (base ? base.id : day.key+'_cardio'),
      label: cfg.label || (CARDIO_TYPES[type]||CARDIO_TYPES.custom).label,
      type, isLongao: type==='longao',
      target: Object.assign({}, empty, cfg.target||{}),
      longaoKm: Array.isArray(cfg.longaoKm) ? cfg.longaoKm : LONGAO_KM.slice()
    };
  }
  if(!base) return null;
  return {
    id: base.id, label: base.label, type: BASE_CARDIO_TYPE[base.id] || 'custom', isLongao: !!base.isLongao,
    target: Object.assign({}, empty, base.target||{}, c.cardioOverride||{}),
    longaoKm: Array.isArray(c.longaoKmOverride) ? c.longaoKmOverride : LONGAO_KM.slice()
  };
}
function ensureCardioCfg(day){
  if(!customTemplates[day.key]) customTemplates[day.key] = {};
  const c = customTemplates[day.key];
  if(!c.cardioConfig){
    const cur = effectiveCardio(day);
    if(cur){
      c.cardioConfig = {enabled:true, id:cur.id, type:cur.type, label:cur.label, target:Object.assign({}, cur.target), longaoKm:cur.longaoKm.slice()};
    } else {
      c.cardioConfig = {enabled:false, id:day.key+'_cardio', type:'leve', label:CARDIO_TYPES.leve.label, target:Object.assign({}, CARDIO_TYPES.leve.defaults), longaoKm:LONGAO_KM.slice()};
    }
  }
  if(!c.cardioConfig.target) c.cardioConfig.target = {};
  return c.cardioConfig;
}
function longaoKmFor(n){
  for(const d of DAY_TEMPLATES){
    const cd = effectiveCardio(d);
    if(cd && cd.isLongao){ const v = cd.longaoKm[n-1]; return (v!=null && v!=='') ? v : LONGAO_KM[n-1]; }
  }
  return null;
}
function longaoCardioIds(){
  const ids = [];
  DAY_TEMPLATES.forEach(d=>{ const cd = effectiveCardio(d); if(cd && cd.isLongao) ids.push(cd.id); });
  return ids;
}
function findExercise(exId){
  const wk = weekInfo(currentWeek);
  for(const d of DAY_TEMPLATES){
    const f = getDayExercises(d, wk).find(e=>e.id===exId);
    if(f) return f;
  }
  return null;
}
function setStats(s, ex){
  if(s && Array.isArray(s.parts)){
    let reps=0, vol=0, n=0;
    s.parts.forEach(p=>{
      if(!p) return;
      const r = parseFloat(p.reps)||0, c = parseFloat(p.carga)||0;
      if(r){ reps+=r; vol+=c*r; n++; }
    });
    const countEach = ex && (ex.method==='superset' || ex.method==='triset');
    return {sets: n===0 ? 0 : (countEach ? n : 1), reps, vol};
  }
  const r = parseFloat(s && s.reps)||0, c = parseFloat(s && s.carga)||0;
  return r ? {sets:1, reps:r, vol:c*r} : {sets:0, reps:0, vol:0};
}

function updateTemplateField(day, exId, field, value, scopeKey){
  const key = day.key;
  if(!customTemplates[key]) customTemplates[key] = {};
  if(!customTemplates[key][scopeKey]) customTemplates[key][scopeKey] = {};
  const scope = customTemplates[key][scopeKey];
  const val = (field==='baseSets') ? (parseInt(value)||1) : value;
  const existsInBase = day.strength.some(e=>e.id===exId);
  if(existsInBase){
    if(!scope.overrides) scope.overrides = {};
    if(!scope.overrides[exId]) scope.overrides[exId] = {};
    scope.overrides[exId][field] = val;
  } else {
    SCOPES.forEach(sk=>{
      const sc = customTemplates[key][sk];
      if(sc && sc.added){
        const item = sc.added.find(e=>e.id===exId);
        if(item) item[field] = val;
      }
    });
  }
  saveTemplates();
}

function removeExerciseCore(day, exId, scopeKey){
  const key = day.key;
  if(!customTemplates[key]) customTemplates[key] = {};
  const existsInBase = day.strength.some(e=>e.id===exId);
  if(existsInBase){
    if(!customTemplates[key][scopeKey]) customTemplates[key][scopeKey] = {};
    const scope = customTemplates[key][scopeKey];
    scope.removed = scope.removed || [];
    if(!scope.removed.includes(exId)) scope.removed.push(exId);
  } else {
    SCOPES.forEach(sk=>{
      const sc = customTemplates[key][sk];
      if(sc && sc.added) sc.added = sc.added.filter(e=>e.id!==exId);
    });
  }
}
function registerUndo(restoreFn, message){
  if(pendingUndo) clearTimeout(pendingUndo.timeoutId);
  pendingUndo = { restore: restoreFn, message: message || 'Exercício removido', timeoutId: setTimeout(()=>{ pendingUndo=null; render(); }, 6000) };
}
function restoreDaySnapshot(day, snapshot){
  const parsed = JSON.parse(snapshot);
  if(parsed===null) delete customTemplates[day.key]; else customTemplates[day.key] = parsed;
  saveTemplates();
}
function removeExercise(day, exId, scopeKey){
  const snapshot = JSON.stringify(customTemplates[day.key] || null);
  removeExerciseCore(day, exId, scopeKey);
  saveTemplates();
  registerUndo(()=>restoreDaySnapshot(day, snapshot), 'Exercício removido');
  render();
}
function clearDayExercises(day, scopeKey){
  const snapshot = JSON.stringify(customTemplates[day.key] || null);
  getDayExercisesForScope(day, scopeKey).forEach(ex=>removeExerciseCore(day, ex.id, scopeKey));
  saveTemplates();
  registerUndo(()=>restoreDaySnapshot(day, snapshot), 'Exercícios do dia removidos');
  render();
}

function addExercise(day, name, sets, reps, scopeKey, method, partsStr){
  method = method || 'normal';
  let parts = [];
  if(method!=='normal'){
    parts = parseParts(method, partsStr);
    if(parts.length < METHODS[method].min){
      alert('Para '+METHODS[method].label+' informe pelo menos '+METHODS[method].min+' itens separados por "+". Ex: Rosca direta + Rosca alternada');
      return;
    }
    if(!name || !name.trim()) name = parts.join(' + ');
  }
  if(!name || !name.trim()) return;
  const key = day.key;
  if(!customTemplates[key]) customTemplates[key] = {};
  if(!customTemplates[key][scopeKey]) customTemplates[key][scopeKey] = {};
  const scope = customTemplates[key][scopeKey];
  scope.added = scope.added || [];
  const id = 'custom_' + Date.now() + '_' + Math.floor(Math.random()*1000);
  const item = {id, name:name.trim(), baseSets: parseInt(sets)||3, baseReps: reps||'', main:false};
  if(method!=='normal'){ item.method = method; item.parts = parts; }
  scope.added.push(item);
  saveTemplates();
  render();
}

function restoreDay(day, scopeKey){
  if(customTemplates[day.key]) delete customTemplates[day.key][scopeKey];
  saveTemplates();
  render();
}

/* ============================= HELPERS ============================= */

function targetFor(ex, wk){
  if(ex.isTime){
    if(wk.isDeload) return {sets: Math.max(1, Math.round(ex.baseSets*0.6)), reps: ex.baseReps, note:'controlado · sem falha'};
    return {sets: ex.baseSets, reps: ex.baseReps, note: wk.meso.note};
  }
  if(wk.isDeload){
    return {sets: Math.max(1, Math.round(ex.baseSets*0.6)), reps: ex.baseReps, note:'-20% carga · sem falha'};
  }
  if(wk.phaseKey==='adaptacao'){
    return {sets: ex.baseSets, reps: ex.baseReps, note:'65–70% 1RM · RPE 7'};
  }
  if(wk.phaseKey==='volume'){
    if(ex.main) return {sets: ex.baseSets+1, reps: ex.volumeReps||ex.baseReps, note:'70–75% 1RM · RPE 7–8'};
    return {sets: ex.baseSets, reps: ex.baseReps, note:'70–75% 1RM · RPE 7–8'};
  }
  if(wk.phaseKey==='forca'){
    if(ex.main) return {sets: 5, reps: ex.forcaReps||ex.baseReps, note:'75–85% 1RM · RPE 8–9'};
    return {sets: ex.baseSets, reps: ex.baseReps, note:'75–85% 1RM · RPE 8–9 (isoladores 8–10 reps)'};
  }
  return {sets: ex.baseSets, reps: ex.baseReps, note:''};
}

function cardioTarget(cardio, wk){
  if(cardio.isLongao){
    const arr = cardio.longaoKm || LONGAO_KM;
    const val = (arr[wk.n-1]!=null && arr[wk.n-1]!=='') ? arr[wk.n-1] : LONGAO_KM[wk.n-1];
    return val + ' km — ritmo leve e constante';
  }
  return (cardio.target && cardio.target[wk.phaseKey]) || '—';
}

function phaseClass(wk){ return wk.isDeload ? 'phase-deload' : 'phase-'+wk.phaseKey; }
function phaseLabel(wk){ return wk.isDeload ? 'Deload' : wk.meso.label; }

function epley1RM(carga, reps){
  const w = parseFloat(String(carga).replace(',', '.'));
  const r = parseFloat(String(reps).replace(',', '.'));
  if(!w || !r || w<=0 || r<=0) return null;
  return Math.round(w*(1+r/30)*10)/10;
}

function bestWorkSet(sets){
  if(!Array.isArray(sets)) return null;
  let best=null, bestVal=-1;
  sets.filter(s=>s.tipo!=='aquecimento' && s.tipo!=='drop' && s.carga && s.reps).forEach(s=>{
    const v = epley1RM(s.carga, s.reps);
    if(v && v>bestVal){ bestVal=v; best=s; }
  });
  return best;
}

function prevLogFor(id){
  return (prevWeekData && prevWeekData.logs) ? prevWeekData.logs[id] : null;
}

function prevSummary(ex, wk){
  const log = prevLogFor(ex.id);
  if(!log || !Array.isArray(log.sets) || log.sets.length===0) return null;
  if(log.sets.some(x=>Array.isArray(x.parts))){
    let vol = 0; log.sets.forEach(x=>{ vol += setStats(x, ex).vol; });
    return vol ? ('sem. '+(wk.n-1)+': '+log.sets.length+' séries · '+Math.round(vol)+'kg vol.') : null;
  }
  const best = bestWorkSet(log.sets);
  if(!best) return null;
  let txt = `sem. ${wk.n-1}: ${best.carga}kg × ${best.reps}`;
  if(!ex.isTime){
    const e1 = epley1RM(best.carga, best.reps);
    if(e1) txt += ` (e1RM ≈ ${e1}kg)`;
  }
  return txt;
}

function summaryChipFor(log){
  if(!log || !Array.isArray(log.sets) || log.sets.length===0) return '';
  const parts = [`${log.sets.length} série${log.sets.length>1?'s':''}`];
  if(log.sets.some(x=>Array.isArray(x.parts))){
    let vol = 0; log.sets.forEach(x=>{ vol += setStats(x, null).vol; });
    if(vol) parts.push(Math.round(vol)+'kg vol.');
  } else {
    const best = bestWorkSet(log.sets);
    if(best) parts.push(`melhor ${best.carga}kg×${best.reps}`);
  }
  return parts.join(' · ');
}

function phaseRPE(wk){
  if(wk.isDeload) return 6;
  return ({adaptacao:7, volume:7.5, forca:8.5})[wk.phaseKey] || 7;
}

function referenceE1RM(exId){
  let best = histBest[exId] || 0;
  const pl = prevLogFor(exId);
  const pb = pl ? bestWorkSet(pl.sets) : null;
  const pv = pb ? epley1RM(pb.carga, pb.reps) : null;
  if(pv && pv > best) best = pv;
  return best || null;
}

// Estimated RPE from load x reps against the best e1RM from OTHER weeks (reps in reserve = max reps at that load - reps done)
function estimateRPE(exId, carga, reps){
  const ref = referenceE1RM(exId);
  const w = parseFloat(String(carga).replace(',', '.'));
  const r = parseFloat(String(reps).replace(',', '.'));
  if(!ref || !w || !r || w<=0 || r<=0) return null;
  const maxReps = 30 * (ref / w - 1);
  let rpe = 10 - (maxReps - r);
  rpe = Math.max(5, Math.min(10, rpe));
  return Math.round(rpe * 2) / 2;
}

function addSetTo(exId){
  if(!weekData.logs[exId]) weekData.logs[exId] = {sets:[], obs:''};
  const log = weekData.logs[exId];
  if(!Array.isArray(log.sets)) log.sets = [];
  const prev = log.sets.length ? log.sets[log.sets.length-1] : null;
  let rpe = '';
  if(!TIME_BASED_IDS.has(exId)){
    rpe = (prev && prev.tipo!=='aquecimento' && prev.rpe) ? prev.rpe : String(phaseRPE(weekInfo(currentWeek)));
  }
  const ex = findExercise(exId);
  const ns = {tipo:'trabalho', rpe, rpeAuto:true};
  if(isMethodEx(ex)) ns.parts = ex.parts.map(()=>({carga:'', reps:''}));
  else { ns.carga = ''; ns.reps = ''; }
  log.sets.push(ns);
}

function autoFillRPE(exId, idx){
  const log = weekData.logs[exId];
  const s = log && Array.isArray(log.sets) ? log.sets[idx] : null;
  if(!s || TIME_BASED_IDS.has(exId)) return;
  const isAuto = s.rpeAuto===true || (s.rpeAuto===undefined && !s.rpe);
  if(!isAuto || s.tipo==='aquecimento') return;
  let val = (s.tipo==='drop') ? 9.5 : estimateRPE(exId, s.carga, s.reps);
  if(val===null) val = s.rpe ? parseFloat(s.rpe) : phaseRPE(weekInfo(currentWeek));
  s.rpe = String(val);
  s.rpeAuto = true;
  const inp = document.querySelector('input[data-setex="'+exId+'"][data-setidx="'+idx+'"][data-setfield="rpe"]');
  if(inp){ inp.value = s.rpe; inp.classList.add('auto'); }
}

function resolvedMainLiftLabel(lift){
  const day = DAY_TEMPLATES.find(d=>d.key===lift.dayKey);
  const wk = weekInfo(currentWeek);
  const exs = getDayExercisesForScope(day, wk.mesoKey);
  const found = exs.find(e=>e.id===lift.id);
  return (found && found.name) ? found.name : lift.label;
}

function computeSessionTotals(day, wk){
  const exercises = getDayExercises(day, wk);
  let workSets=0, workReps=0, workVolume=0, warmSets=0, warmReps=0, warmVolume=0;
  exercises.forEach(ex=>{
    if(ex.isTime) return;
    const log = weekData.logs[ex.id];
    if(!log || !Array.isArray(log.sets)) return;
    log.sets.forEach(st=>{
      const x = setStats(st, ex);
      if(!x.sets) return;
      if(st.tipo==='aquecimento'){ warmSets+=x.sets; warmReps+=x.reps; warmVolume+=x.vol; }
      else { workSets+=x.sets; workReps+=x.reps; workVolume+=x.vol; }
    });
  });
  return {workSets, workReps, workVolume:Math.round(workVolume), warmSets, warmReps, warmVolume:Math.round(warmVolume)};
}

function translateAuthError(err){
  const m = (err && err.message ? err.message : String(err||'')).toLowerCase();
  if(m.includes('invalid login credentials')) return 'E-mail ou senha incorretos. Se a conta foi criada por link de e-mail, use "Esqueci minha senha" para definir uma senha.';
  if(m.includes('email not confirmed')) return 'Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam).';
  if(m.includes('already registered')) return 'Este e-mail já tem conta. Use "Entrar" ou "Esqueci minha senha".';
  if(m.includes('password should be') || m.includes('weak password')) return 'Senha fraca ou curta demais. Use pelo menos 6 caracteres.';
  if(m.includes('rate limit') || m.includes('too many')) return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(m.includes('invalid email') || m.includes('unable to validate email')) return 'E-mail inválido.';
  if(m.includes('same password') || m.includes('different from the old')) return 'A nova senha precisa ser diferente da atual.';
  if(m.includes('failed to fetch') || m.includes('network')) return 'Sem conexão. Verifique sua internet.';
  return 'Erro: ' + (err && err.message ? err.message : 'tente novamente.');
}

function authRedirectUrl(){
  return window.location.href.split('#')[0].split('?')[0];
}

async function handleAuthSubmit(){
  const email = (document.getElementById('auth-email')?.value || '').trim();
  const password = document.getElementById('auth-password')?.value || '';
  const msgEl = document.getElementById('auth-message');
  const say = t => { if(msgEl) msgEl.textContent = t; };
  if(!sb){ say('Sincronização indisponível no momento.'); return; }
  if(!email || !email.includes('@')){ say('Digite um e-mail válido.'); return; }
  if(password.length < 6){ say('A senha precisa ter pelo menos 6 caracteres.'); return; }
  say('Aguarde...');
  try{
    if(authMode==='signup'){
      const { data, error } = await sb.auth.signUp({ email, password, options:{ emailRedirectTo: authRedirectUrl() } });
      if(error){ say(translateAuthError(error)); return; }
      if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
        say('Este e-mail já tem conta. Use "Entrar" ou "Esqueci minha senha".'); return;
      }
      if(data && data.session){ say('Conta criada! Você já está conectado.'); }
      else { say('Conta criada! Enviamos um e-mail de confirmação — abra o link e depois volte aqui para entrar com sua senha.'); }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error){ say(translateAuthError(error)); return; }
    }
  }catch(e){ say(translateAuthError(e)); }
}

async function handleForgotPassword(){
  const email = (document.getElementById('auth-email')?.value || '').trim();
  const msgEl = document.getElementById('auth-message');
  const say = t => { if(msgEl) msgEl.textContent = t; };
  if(!sb){ say('Sincronização indisponível no momento.'); return; }
  if(!email || !email.includes('@')){ say('Digite seu e-mail acima e toque em "Esqueci minha senha".'); return; }
  say('Enviando...');
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: authRedirectUrl() });
    say(error ? translateAuthError(error) : 'Enviamos um link para redefinir a senha. Abra-o no mesmo aparelho e defina a nova senha.');
  }catch(e){ say(translateAuthError(e)); }
}

async function handleChangePassword(){
  const pass = document.getElementById('auth-newpass')?.value || '';
  const msgEl = document.getElementById('auth-message');
  const say = t => { if(msgEl) msgEl.textContent = t; };
  if(!sb || !authUser){ say('Entre na sua conta primeiro.'); return; }
  if(pass.length < 6){ say('A senha precisa ter pelo menos 6 caracteres.'); return; }
  say('Salvando...');
  try{
    const { error } = await sb.auth.updateUser({ password: pass });
    if(error){ say(translateAuthError(error)); return; }
    recoveryMode = false;
    const inp = document.getElementById('auth-newpass'); if(inp) inp.value = '';
    say('Senha atualizada com sucesso.');
  }catch(e){ say(translateAuthError(e)); }
}

function deltaBadgeHtml(ex, wk, curE1){
  if(ex.isTime || !curE1) return '';
  const prevLog = prevLogFor(ex.id);
  const prevBest = prevLog ? bestWorkSet(prevLog.sets) : null;
  const prevE1 = prevBest ? epley1RM(prevBest.carga, prevBest.reps) : null;
  if(!prevE1) return '';
  const diff = Math.round((curE1-prevE1)*10)/10;
  if(diff===0) return `<span class="delta-badge neutral">= e1RM (sem. ${wk.n-1})</span>`;
  const cls = diff>0 ? 'up' : 'down';
  const sign = diff>0 ? '+' : '';
  return `<span class="delta-badge ${cls}">${sign}${diff}kg vs sem. ${wk.n-1}</span>`;
}

function stepperHtml(field, step, exId, i, pi, val, ph, mode){

  const ps = (pi===null) ? '' : ':'+pi;
  return `<div class="stepper">
    <button type="button" data-step="${field}:${-step}:${exId}:${i}${ps}">−</button>
    <input type="text" inputmode="${mode}" placeholder="${ph}" value="${esc(val||'')}" data-setfield="${field}" data-setex="${exId}" data-setidx="${i}"${pa}>
    <button type="button" data-step="${field}:${step}:${exId}:${i}${ps}">+</button>

}

function renderSetRow(ex, s, i){

  const rpeInput = `<input type="text" inputmode="decimal" class="plain rpe-input ${s.rpeAuto?'auto':''}" placeholder="RPE" value="${esc(s.rpe||'')}" data-setfield="rpe" data-setex="${ex.id}" data-setidx="${i}">`;
  if(isMethodEx(ex)){
    const sp = Array.isArray(s.parts) ? s.parts : [];
    const body = ex.parts.map((pname,pi)=>{
      const p = sp[pi] || {};
      return `<div class="part-block"><div class="part-label">${pi+1}. ${esc(pname)}</div>
        <div class="set-row-bottom">${stepperHtml('carga',2.5,ex.id,i,pi,p.carga,'kg','decimal')}${stepperHtml('reps',1,ex.id,i,pi,p.reps,'reps','numeric')}</div></div>`;
    }).join('');
    return `<div class="set-row">${head}${body}<div class="set-row-bottom">${rpeInput}</div></div>`;
  }
  if(ex.isTime){
    return `<div class="set-row">${head}<div class="set-row-bottom">
      <input type="text" class="plain" placeholder="tempo" value="${esc(s.carga||'')}" data-setfield="carga" data-setex="${ex.id}" data-setidx="${i}">

    </div></div>`;
  }
  return `<div class="set-row">${head}<div class="set-row-bottom">${stepperHtml('carga',2.5,ex.id,i,null,s.carga,'kg','decimal')}${stepperHtml('reps',1,ex.id,i,null,s.reps,'reps','numeric')}${rpeInput}</div></div>`;
}

function renderExerciseTable(day, wk){
  const exercises = getDayExercises(day, wk);
  if(exercises.length===0) return '<div class="chart-empty">Nenhum exercício neste dia. Toque em “Editar treino” para adicionar.</div>';
  let lastBlock = null;
  let rows = '';
  exercises.forEach(ex=>{
    if(ex.block && ex.block!==lastBlock){ rows += `<div class="block-label">${esc(ex.block)}</div>`; lastBlock = ex.block; }
    else if(!ex.block && lastBlock!==''){ lastBlock=''; }
    const isM = isMethodEx(ex);
    const t = targetFor(ex, wk);
    const log = weekData.logs[ex.id] || {sets:[], obs:''};
    if(!Array.isArray(log.sets)) log.sets = [];
    const prevTxt = prevSummary(ex, wk);
    const best = (ex.isTime || isM) ? null : bestWorkSet(log.sets);
    const curE1 = best ? epley1RM(best.carga, best.reps) : null;
    const chip = summaryChipFor(log);
    const expanded = !!expandedEx[ex.id];
    const delta = deltaBadgeHtml(ex, wk, curE1);
    const setsHtml = log.sets.map((st,i)=>renderSetRow(ex, st, i)).join('');
    const badge = isM ? `<span class="method-badge">${METHODS[ex.method].label}</span>` : '';
    const mhint = isM ? `${METHODS[ex.method].hint} · ` : '';
    rows += `
      <div class="ex-card">
        <div class="ex-card-head" data-toggle-ex="${ex.id}">
          <div class="ex-name">${ex.main?'<span class="main-flag"></span>':''}${esc(ex.name)}${badge}</div>
          <div class="ex-meta">
            <div class="ex-target-inline">${t.sets}× ${esc(t.reps)}</div>
            <div class="ex-summary-chip" id="chip-${ex.id}">${chip}</div>
            ${delta}
          </div>
          <span class="chevron">${expanded?'▴':'▾'}</span>
        </div>
        <div class="ex-card-body" style="display:${expanded?'block':'none'}">
          <div class="ex-note-line">${mhint}${t.note}${prevTxt?' · '+prevTxt:''}</div>
          ${setsHtml}
          <button type="button" class="add-set-btn" data-addset="${ex.id}">+ Adicionar série</button>
          ${log.sets.length>0 ? `<button type="button" class="add-set-btn" data-dupset="${ex.id}">⧉ Duplicar última</button>` : ''}
          <div class="rest-btn-row">
            <button type="button" data-resttimer="60">⏱ 60s</button>
            <button type="button" data-resttimer="90">⏱ 90s</button>
            <button type="button" data-resttimer="120">⏱ 120s</button>
          </div>
          <input type="text" class="obs-input" placeholder="Observações deste exercício" data-obsex="${ex.id}" value="${esc(log.obs||'')}">
          ${(!ex.isTime && !isM) ? `<div class="e1rm-note" id="e1rm-${ex.id}">${curE1?'e1RM ≈ '+curE1+'kg':''}<span id="pr-${ex.id}"></span></div>` : ''}
        </div>
      </div>`;
  });
  return rows;
}

async function collectAllWeeks(force){
  if(force || !weeksCache || weeksCache.program!==currentProgram){
    const prog = currentProgram;
    const data = await Promise.all(Array.from({length:12}, async (_,i)=>{
      try{
        const raw = await kvGet('prog:'+prog+':week:'+(i+1));
        return raw ? JSON.parse(raw) : null;
      }catch(e){ return null; }
    }));
    weeksCache = {program: prog, data};
  }
  const out = weeksCache.data.slice();
  if(weekData && weekData.logs) out[currentWeek-1] = weekData; // always use the live in-memory week
  return out;
}

function lineChartSVG(points, opts){
  const W = opts.width||600, H = opts.height||140, pad=28;
  const valid = points.filter(p=>p.y!==null && p.y!==undefined && p.y!=='');
  if(valid.length===0) return null;
  const ys = valid.map(p=>+p.y);
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  if(minY===maxY){ minY -= 1; maxY += 1; }
  const xStep = (W-pad*2)/11;
  const toX = i => pad + i*xStep;
  const toY = y => H-pad - ((y-minY)/(maxY-minY))*(H-pad*2);
  let path = '';
  let dots = '';
  points.forEach((p,i)=>{
    if(p.y===null||p.y===undefined||p.y==='') return;
    const x = toX(i), y = toY(+p.y);
    path += (path===''?'M':'L') + x + ',' + y + ' ';
    dots += `<circle cx="${x}" cy="${y}" r="3" fill="${opts.color}"></circle>`;
  });
  const gridLines = Array.from({length:12}).map((_,i)=>`<line x1="${toX(i)}" y1="${pad-10}" x2="${toX(i)}" y2="${H-pad}" stroke="var(--line)" stroke-width="1"></line>`).join('');
  const labels = Array.from({length:12}).map((_,i)=>`<text x="${toX(i)}" y="${H-8}" font-size="9" fill="var(--ink-faint)" text-anchor="middle">${i+1}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${gridLines}<path d="${path.trim()}" fill="none" stroke="${opts.color}" stroke-width="2"></path>${dots}${labels}</svg>`;
}

  all.forEach(w=>{

    Object.values(w.logs).forEach(log=>{
      if(log && Array.isArray(log.sets) && log.sets.length){ totalSetsLogged += log.sets.length; hasAny = true; }
    });
    if(hasAny) weeksWithData++;
  });

  let html = `<div class="export-row">

  html += `<div class="ring-row">

    const points = all.map(w=>{
      const log = w && w.logs && w.logs[lift.id];
      const best = log ? bestWorkSet(log.sets) : null;
      return {y: best ? epley1RM(best.carga, best.reps) : null};
    });
    const svg = lineChartSVG(points, {color:'#E8590C'});
    html += `<div class="chart-block">
      <h3>${label}</h3>
      <div class="chart-sub">e1RM estimado (kg) por semana, a partir da melhor série de trabalho — fórmula de Epley.</div>
      ${svg || '<div class="chart-empty">Sem registros ainda — logue uma série de trabalho para ver a curva.</div>'}
    </div>`;
  });

  const tonnagePoints = all.map(w => ({y: computeWeekTonnage(w)}));
  const tonnageSvg = lineChartSVG(tonnagePoints, {color:'#2E7D52'});
  html += `<div class="chart-block">
    <h3>Volume total (tonelagem)</h3>
    <div class="chart-sub">Soma de carga × reps de todas as séries de trabalho registradas na semana (todos os exercícios com peso, não só os principais).</div>
    ${tonnageSvg || '<div class="chart-empty">Sem registros ainda.</div>'}
  </div>`;

  const lgIds = longaoCardioIds();
  const longaoPoints = all.map(w=>{
    if(!w || !w.cardio) return {y:null};
    let tot = 0, any = false;
    lgIds.forEach(id=>{ const v = parseFloat(w.cardio[id] && w.cardio[id].km); if(v){ tot += v; any = true; } });
    return {y: any ? Math.round(tot*10)/10 : null};
  });
  const longaoSvg = lineChartSVG(longaoPoints, {color:'#3E5C78'});
  html += `<div class="chart-block">
    <h3>Longão</h3>
    <div class="chart-sub">Distância percorrida (km) por semana</div>
    ${longaoSvg || '<div class="chart-empty">Sem registros ainda — logue os km do longão para ver a curva.</div>'}

  el.innerHTML = html;
  document.getElementById('export-btn')?.addEventListener('click', exportData);

  });

async function handleImportFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    if(!payload || !Array.isArray(payload.semanas)) throw new Error('formato inválido');
    for(const item of payload.semanas){
      if(item && item.dados && item.semana){
        await kvSet(pk('week:'+item.semana), JSON.stringify(item.dados));
      }
    }
    if(payload.templates_personalizados){
      customTemplates = payload.templates_personalizados;
      await kvSet(pk('templates'), JSON.stringify(customTemplates));
    }
    weeksCache = null;
    await loadWeek(currentWeek);
    await loadPrevWeek(currentWeek);
    render();
    alert('Registros importados com sucesso.');
  }catch(err){
    alert('Não foi possível importar: arquivo inválido ou corrompido.');
  }
  e.target.value = '';
}

async function exportData(){
  const all = await collectAllWeeks();
  const payload = {
    exportado_em: new Date().toISOString(),
    semana_atual: currentWeek,
    templates_personalizados: customTemplates,
    semanas: all.map((dados, i) => ({ semana: i+1, dados }))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'protocolo-12-semanas-registros.json';

  URL.revokeObjectURL(url);
}

/* ============================= REST TIMER ============================= */

let restTimerState = {seconds:0, total:0, running:false, intervalId:null};

function startRestTimer(seconds){
  clearInterval(restTimerState.intervalId);
  restTimerState = {seconds, total:seconds, running:true, intervalId:null};
  renderRestTimerWidget();
  restTimerState.intervalId = setInterval(()=>{
    restTimerState.seconds--;
    if(restTimerState.seconds<=0){
      clearInterval(restTimerState.intervalId);
      restTimerState.running = false;
      restTimerState.seconds = 0;
      onRestTimerDone();
    }
    renderRestTimerWidget();
  }, 1000);
}
function stopRestTimer(){
  clearInterval(restTimerState.intervalId);
  restTimerState = {seconds:0, total:0, running:false, intervalId:null};
  renderRestTimerWidget();
}
function onRestTimerDone(){
  if(navigator.vibrate) navigator.vibrate([250,120,250,120,250]);
  playBeep();
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    osc.start();
    setTimeout(()=>{ osc.stop(); ctx.close(); }, 500);
  }catch(e){}
}
function fmtTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return m+':'+String(sec).padStart(2,'0');
}
function renderRestTimerWidget(){
  const el = document.getElementById('rest-timer-widget');
  if(!el) return;
  if(!restTimerState.running && restTimerState.seconds<=0){
    el.classList.remove('show');
    el.innerHTML = '';
    return;
  }
  el.classList.add('show');
  el.innerHTML = `
    <div><div class="rt-label">Descanso</div><div class="rt-time num">${fmtTime(restTimerState.seconds)}</div></div>
    <button id="rest-timer-stop">Parar</button>
  `;
  document.getElementById('rest-timer-stop')?.addEventListener('click', stopRestTimer);
}

async function shareDaySummary(day, wk){
  const exercises = getDayExercises(day, wk);
  let lines = [`${day.label} — ${dayFocus(day)} (Semana ${wk.n}/12)`];
  exercises.forEach(ex=>{
    const log = weekData.logs[ex.id];
    if(!log || !Array.isArray(log.sets) || log.sets.length===0) return;
    if(isMethodEx(ex)){
      let vol = 0; log.sets.forEach(x=>{ vol += setStats(x, ex).vol; });
      lines.push(`• ${METHODS[ex.method].label} — ${ex.name}: ${log.sets.length} séries${vol ? ', '+Math.round(vol)+'kg de volume' : ''}`);
      return;
    }
    const best = bestWorkSet(log.sets);
    if(best) lines.push(`• ${ex.name}: ${log.sets.length} séries, melhor ${best.carga}kg×${best.reps}`);
  });
  const cd = effectiveCardio(day);
  if(cd){
    const cl = weekData.cardio[cd.id] || {};
    const bits = [cl.km ? cl.km+' km' : '', cl.tempo ? cl.tempo+' min' : '', cl.feito || ''].filter(Boolean);
    if(bits.length) lines.push(`• ${cd.label}: ${bits.join(' · ')}`);
  }
  const t = computeSessionTotals(day, wk);
  const totalVol = t.workVolume+t.warmVolume, totalSets = t.workSets+t.warmSets;
  if(totalSets) lines.push(`Total: ${totalSets} séries · ${totalVol}kg`);
  const note = weekData.dayNotes && weekData.dayNotes[day.key];
  if(note && String(note).trim()) lines.push('Obs: ' + String(note).trim());
  const text = lines.join('\n');
  if(navigator.share){
    try{ await navigator.share({title:'Meu treino', text}); }catch(e){}
  } else {
    try{
      await navigator.clipboard.writeText(text);
      alert('Resumo copiado para a área de transferência.');
    }catch(e){ alert(text); }
  }
}

      if(!log || !Array.isArray(log.sets) || !log.sets.length) return;
      const last = log.sets[log.sets.length-1];
      log.sets.push(JSON.parse(JSON.stringify(last)));
      expandedEx[exId] = true;
      scheduleSave();
      render();
    });
  });
  document.querySelectorAll('[data-step]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [field, deltaStr, exId, idxStr, partStr] = btn.dataset.step.split(':');
      const idx = parseInt(idxStr);
      const delta = parseFloat(deltaStr);
      const hasPart = (partStr!==undefined);
      if(!weekData.logs[exId]) weekData.logs[exId] = {sets:[], obs:''};
      if(!weekData.logs[exId].sets[idx]) weekData.logs[exId].sets[idx] = {tipo:'trabalho'};
      const sObj = weekData.logs[exId].sets[idx];
      let target = sObj;
      if(hasPart){
        if(!Array.isArray(sObj.parts)) sObj.parts = [];
        const pi = parseInt(partStr);
        if(!sObj.parts[pi]) sObj.parts[pi] = {carga:'', reps:''};
        target = sObj.parts[pi];
      }
      const cur = parseFloat(target[field]) || 0;
      let next = cur + delta;
      next = field==='reps' ? Math.max(0, Math.round(next)) : Math.max(0, Math.round(next*10)/10);
      target[field] = String(next);
      autoFillRPE(exId, idx);
      scheduleSave();
      updateE1RMDisplay(exId);
      updateSummaryChip(exId);
      updateTotalsDisplay();
      const sel = 'input[data-setex="'+exId+'"][data-setidx="'+idx+'"][data-setfield="'+field+'"]' + (hasPart ? '[data-partidx="'+partStr+'"]' : ':not([data-partidx])');
      const inp = document.querySelector(sel);
      if(inp) inp.value = target[field];
    });
  });
  document.querySelectorAll('[data-removeset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [exId, idxStr] = btn.dataset.removeset.split(':');
      const idx = parseInt(idxStr);
      if(weekData.logs[exId] && Array.isArray(weekData.logs[exId].sets)){
        weekData.logs[exId].sets.splice(idx,1);
      }
      expandedEx[exId] = true;
      scheduleSave();
      render();
    });
  });
  document.querySelectorAll('[data-toggletype]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [exId, idxStr] = btn.dataset.toggletype.split(':');
      const idx = parseInt(idxStr);
      const s = weekData.logs[exId] && weekData.logs[exId].sets[idx];
      if(s){
        const order = ['trabalho','aquecimento','drop'];
        s.tipo = order[(order.indexOf(s.tipo||'trabalho')+1) % 3];
        s.rpe = '';
        s.rpeAuto = true;
        if(s.tipo!=='aquecimento') autoFillRPE(exId, idx);
      }
      expandedEx[exId] = true;
      scheduleSave();
      render();
    });
  });
  document.querySelectorAll('[data-setfield]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const exId = inp.dataset.setex, idx = parseInt(inp.dataset.setidx), field = inp.dataset.setfield;
      if(!weekData.logs[exId]) weekData.logs[exId] = {sets:[], obs:''};
      if(!weekData.logs[exId].sets[idx]) weekData.logs[exId].sets[idx] = {tipo:'trabalho'};
      const sObj = weekData.logs[exId].sets[idx];
      const pidx = inp.dataset.partidx;
      if(pidx!==undefined){
        if(!Array.isArray(sObj.parts)) sObj.parts = [];
        if(!sObj.parts[pidx]) sObj.parts[pidx] = {carga:'', reps:''};
        sObj.parts[pidx][field] = inp.value;
      } else {
        sObj[field] = inp.value;
      }
      if(field==='rpe'){
        const ss = weekData.logs[exId].sets[idx];
        ss.rpeAuto = (inp.value.trim()==='');
        inp.classList.toggle('auto', ss.rpeAuto);
      } else if(field==='carga' || field==='reps'){
        autoFillRPE(exId, idx);
      }
      scheduleSave();
      updateE1RMDisplay(exId);
      updateSummaryChip(exId);
      updateTotalsDisplay();
    });
  });
  document.querySelectorAll('[data-obsex]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const exId = inp.dataset.obsex;
      if(!weekData.logs[exId]) weekData.logs[exId] = {sets:[], obs:''};
      weekData.logs[exId].obs = inp.value;
      scheduleSave();
    });
  });
  document.querySelectorAll('[data-editfield]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const day = DAY_TEMPLATES[activeDayIdx];
      updateTemplateField(day, inp.dataset.editex, inp.dataset.editfield, inp.value, editScope);
    });
  });
  document.querySelectorAll('[data-removeex]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const day = DAY_TEMPLATES[activeDayIdx];
      removeExercise(day, btn.dataset.removeex, editScope);
    });
  });
  document.getElementById('add-ex-btn')?.addEventListener('click', ()=>{
    const day = DAY_TEMPLATES[activeDayIdx];
    const name = document.getElementById('new-ex-name').value;
    const sets = document.getElementById('new-ex-sets').value;
    const reps = document.getElementById('new-ex-reps').value;
    const method = document.getElementById('new-ex-method') ? document.getElementById('new-ex-method').value : 'normal';
    const partsStr = document.getElementById('new-ex-parts') ? document.getElementById('new-ex-parts').value : '';
    addExercise(day, name, sets, reps, editScope, method, partsStr);
  });
  document.getElementById('new-ex-method')?.addEventListener('change', (e)=>{
    const m = e.target.value;
    const pin = document.getElementById('new-ex-parts');
    const hint = document.getElementById('new-ex-hint');
    if(pin) pin.style.display = (m==='normal') ? 'none' : 'block';
    if(hint) hint.textContent = (m==='normal') ? '' : (METHODS[m].label + ': ' + METHODS[m].hint + '. Separe os exercícios com "+".');
  });
  document.getElementById('clear-day-btn')?.addEventListener('click', ()=>{
    clearDayExercises(DAY_TEMPLATES[activeDayIdx], editScope);
  });
  document.getElementById('day-focus-input')?.addEventListener('change', (e)=>{
    ensureDayMeta(DAY_TEMPLATES[activeDayIdx]).focus = e.target.value.trim();
    saveTemplates();
  });
  document.getElementById('day-rest-check')?.addEventListener('change', (e)=>{
    ensureDayMeta(DAY_TEMPLATES[activeDayIdx]).rest = e.target.checked;
    saveTemplates();
    render();
  });
  document.querySelectorAll('[data-editmethod]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const day = DAY_TEMPLATES[activeDayIdx];
      const exId = sel.dataset.editmethod, m = sel.value;
      const ex = getDayExercisesForScope(day, editScope).find(e=>e.id===exId);
      if(!ex) return;
      updateTemplateField(day, exId, 'method', m, editScope);
      if(m==='normal'){
        updateTemplateField(day, exId, 'parts', [], editScope);
      } else {
        let parts = parseParts(m, (ex.parts && ex.parts.length) ? ex.parts.join(' + ') : ex.name);
        while(parts.length < METHODS[m].min) parts.push('Exercício '+(parts.length+1));
        updateTemplateField(day, exId, 'parts', parts, editScope);
      }
      render();
    });
  });
  document.querySelectorAll('[data-editparts]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const day = DAY_TEMPLATES[activeDayIdx];
      const exId = inp.dataset.editparts;
      const ex = getDayExercisesForScope(day, editScope).find(e=>e.id===exId);
      if(!ex || !ex.method) return;
      const parts = parseParts(ex.method, inp.value);
      if(parts.length < METHODS[ex.method].min){
        alert('Informe pelo menos '+METHODS[ex.method].min+' itens separados por "+".');
        render();
        return;
      }
      updateTemplateField(day, exId, 'parts', parts, editScope);
      render();
    });
  });
  document.getElementById('restore-day-btn')?.addEventListener('click', ()=>{
    const day = DAY_TEMPLATES[activeDayIdx];
    if(confirm('Restaurar este treino para o padrão original nesta seleção de semanas?')) restoreDay(day, editScope);
  });
  document.getElementById('cardio-enabled')?.addEventListener('change', (e)=>{
    const cfg = ensureCardioCfg(DAY_TEMPLATES[activeDayIdx]);
    cfg.enabled = e.target.checked;
    saveTemplates();
    render();
  });
  document.getElementById('cardio-type')?.addEventListener('change', (e)=>{
    const cfg = ensureCardioCfg(DAY_TEMPLATES[activeDayIdx]);
    const old = cfg.type, nt = e.target.value;
    const oldLabel = (CARDIO_TYPES[old]||{}).label;
    cfg.type = nt;
    if(!cfg.label || cfg.label===oldLabel) cfg.label = CARDIO_TYPES[nt].label;
    if(nt==='longao'){ if(!Array.isArray(cfg.longaoKm)) cfg.longaoKm = LONGAO_KM.slice(); }
    else if(CARDIO_TYPES[nt].defaults){ cfg.target = Object.assign({}, CARDIO_TYPES[nt].defaults); }
    saveTemplates();
    render();
  });
  document.getElementById('cardio-label')?.addEventListener('change', (e)=>{
    const cfg = ensureCardioCfg(DAY_TEMPLATES[activeDayIdx]);
    cfg.label = e.target.value.trim() || CARDIO_TYPES[cfg.type].label;
    saveTemplates();
  });
  document.querySelectorAll('[data-cardiophase]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const cfg = ensureCardioCfg(DAY_TEMPLATES[activeDayIdx]);
      cfg.target[inp.dataset.cardiophase] = inp.value;
      saveTemplates();
    });
  });
  document.querySelectorAll('[data-longaoweek]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const cfg = ensureCardioCfg(DAY_TEMPLATES[activeDayIdx]);
      if(!Array.isArray(cfg.longaoKm)) cfg.longaoKm = LONGAO_KM.slice();
      cfg.longaoKm[parseInt(inp.dataset.longaoweek)] = inp.value;
      saveTemplates();
    });
  });
  document.querySelectorAll('[data-cardio]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const id = inp.dataset.cardio, field = inp.dataset.cfield;
      if(!weekData.cardio[id]) weekData.cardio[id] = {};
      weekData.cardio[id][field] = inp.value;
      scheduleSave();
    });
  });
  document.getElementById('track-toggle-row')?.addEventListener('click', ()=>{
    trackExpanded = !trackExpanded;
    render();
  });
  document.getElementById('theme-toggle-btn')?.addEventListener('click', toggleTheme);
  document.getElementById('program-switcher-btn')?.addEventListener('click', ()=>{
    showProgramPanel = !showProgramPanel;
    render();
  });
  document.getElementById('auth-toggle-btn')?.addEventListener('click', ()=>{
    showAuthPanel = !showAuthPanel;
    render();
  });
  document.querySelectorAll('[data-authmode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ authMode = btn.dataset.authmode; render(); });
  });
  document.getElementById('auth-submit-btn')?.addEventListener('click', handleAuthSubmit);
  document.getElementById('auth-password')?.addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleAuthSubmit(); });
  document.getElementById('auth-forgot-btn')?.addEventListener('click', handleForgotPassword);
  document.getElementById('auth-changepass-btn')?.addEventListener('click', handleChangePassword);
  document.getElementById('logout-btn')?.addEventListener('click', async ()=>{
    if(sb) await sb.auth.signOut();
    showAuthPanel = false;
  });
  document.querySelectorAll('[data-switchprog]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      showProgramPanel = false;
      switchProgram(btn.dataset.switchprog);
    });
  });
  document.getElementById('new-prog-btn')?.addEventListener('click', ()=>{
    const name = document.getElementById('new-prog-name').value;
    const date = document.getElementById('new-prog-date').value;
    showProgramPanel = false;
    createProgram(name, date || null);
  });
  document.querySelectorAll('[data-goto-today]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeDayIdx = parseInt(btn.dataset.gotoToday);
      activeTab = 'sprint';
      editingDay = false;
      expandedEx = {};
      render();
    });
  });
  document.getElementById('dismiss-reminder-btn')?.addEventListener('click', ()=>{
    dismissedReminderKey = new Date().toDateString();
    render();
  });
  document.querySelectorAll('[data-resttimer]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      startRestTimer(parseInt(btn.dataset.resttimer));
    });
  });
  document.getElementById('share-day-btn')?.addEventListener('click', ()=>{
    const day = DAY_TEMPLATES[activeDayIdx];
    shareDaySummary(day, wk);
  });
  document.getElementById('day-notes-text')?.addEventListener('input', (e)=>{
    const day = DAY_TEMPLATES[activeDayIdx];
    if(!weekData.dayNotes) weekData.dayNotes = {};
    weekData.dayNotes[day.key] = e.target.value;
    scheduleSave();
  });
  document.getElementById('retro-text')?.addEventListener('input', (e)=>{
    weekData.retro = e.target.value;
    scheduleSave();
  });
}

async function goWeek(n){
  if(n<1) return;
  if(n>12){
    const wantsNew = confirm('Você concluiu as 12 semanas! Quer iniciar um novo ciclo (mesociclos reiniciam do zero)?');
    if(wantsNew){
      const name = prompt('Nome do novo ciclo:', 'Ciclo ' + (programs.length+1)) || ('Ciclo ' + (programs.length+1));
      await createProgram(name, null);
    }
    return;
  }
  clearTimeout(saveTimer);
  await saveWeek();
  currentWeek = n;
  activeDayIdx = 0;
  editingDay = false;
  expandedEx = {};
  await saveMeta();
  await loadWeek(n);
  await loadPrevWeek(n);
  render();
}

/* ============================= INIT ============================= */

function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
}
function toggleTheme(){
  theme = theme==='dark' ? 'light' : 'dark';
  localStorage.setItem('treino-theme', theme);
  applyTheme();
  render();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

(async function init(){
  document.getElementById('app').innerHTML = '<div class="chart-empty">Carregando…</div>';
  theme = localStorage.getItem('treino-theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme();
  if(window.supabase) initSupabase();
  await initAuth();
  await loadPrograms();
  await loadMeta();
  await loadTemplates();
  await loadWeek(currentWeek);
  await loadPrevWeek(currentWeek);
  render();
})();
</script>
